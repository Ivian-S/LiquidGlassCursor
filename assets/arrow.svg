<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64">
  <title>Crystal Refraction Arrow</title>
  <desc>LiquidGlassCursor V0.1 的静态水晶折光箭头母版，光源位于左上方。</desc>

  <defs>
    <linearGradient id="glassFill" x1="7" y1="6" x2="49" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.28" stop-color="#f4fbff" stop-opacity="0.16"/>
      <stop offset="0.65" stop-color="#b8e8ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#eaf7ff" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="rimLight" x1="6" y1="4" x2="42" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.42" stop-color="#f9fdff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#bcecff" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="iceFacet" x1="13" y1="13" x2="42" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#80d8ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#348dc4" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="handleFacet" x1="31" y1="37" x2="51" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dff6ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6bbde8" stop-opacity="0.16"/>
    </linearGradient>

    <clipPath id="arrowClip">
      <path d="M 3.2 2.4 C 2.55 2.05 1.82 2.65 2.05 3.38 L 20.6 55.15 C 21.0 56.33 22.62 56.52 23.3 55.48 L 32.1 42.02 L 42.35 59.55 C 42.94 60.58 44.27 60.92 45.28 60.31 L 51.75 56.43 C 52.78 55.81 53.08 54.47 52.43 53.47 L 41.55 36.72 L 57.03 34.72 C 58.26 34.56 58.72 33.02 57.76 32.25 Z"/>
    </clipPath>
  </defs>

  <!-- 深蓝灰轮廓：在浅色背景上维持清晰识别。 -->
  <path d="M 3.2 2.4 C 2.55 2.05 1.82 2.65 2.05 3.38 L 20.6 55.15 C 21.0 56.33 22.62 56.52 23.3 55.48 L 32.1 42.02 L 42.35 59.55 C 42.94 60.58 44.27 60.92 45.28 60.31 L 51.75 56.43 C 52.78 55.81 53.08 54.47 52.43 53.47 L 41.55 36.72 L 57.03 34.72 C 58.26 34.56 58.72 33.02 57.76 32.25 Z"
        fill="url(#glassFill)"
        stroke="#17364d" stroke-opacity="0.92" stroke-width="3"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 内部冰蓝折光切面，保持低不透明度。 -->
  <path d="M 7.0 7.2 L 23.5 47.4 L 31.1 35.9 L 50.3 33.4 Z"
        fill="url(#iceFacet)" clip-path="url(#arrowClip)"/>
  <path d="M 31.1 35.9 L 38.6 37.1 L 49.9 54.3 L 44.3 57.7 Z"
        fill="url(#handleFacet)" clip-path="url(#arrowClip)"/>
  <path d="M 22.3 50.8 L 31.1 37.2 L 34.2 39.4 L 23.0 55.0 Z"
        fill="#d9f5ff" fill-opacity="0.20" clip-path="url(#arrowClip)"/>

  <!-- 左上光源形成的抛光边缘高光。 -->
  <path d="M 4.9 5.2 L 21.6 50.2"
        fill="none" stroke="url(#rimLight)" stroke-width="1.55"
        stroke-linecap="round" opacity="0.94"/>
  <path d="M 5.4 4.8 L 51.7 31.6"
        fill="none" stroke="#ffffff" stroke-opacity="0.52"
        stroke-width="1.15" stroke-linecap="round"/>
  <path d="M 33.3 38.6 L 43.9 56.5"
        fill="none" stroke="#eefbff" stroke-opacity="0.48"
        stroke-width="1.05" stroke-linecap="round"/>

  <!-- 少量晶面分界线，避免在 32px 下产生噪点。 -->
  <path d="M 9.1 11.4 L 31.1 35.9 L 23.0 49.3"
        fill="none" stroke="#b8eaff" stroke-opacity="0.26"
        stroke-width="0.9" stroke-linejoin="round"/>
</svg>
